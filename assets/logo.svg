<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="differ">
  <title>differ</title>
  <!-- differ's own palette (the mocha theme): a removed line, an added line
       with the cursor bar beside it, and an inline review comment under it. -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#1e1e2e" stroke="#45475a" stroke-width="8"/>

  <g transform="translate(12 0)">
  <!-- removed -->
  <rect x="112" y="128" width="304" height="72" rx="18" fill="#3b1d2e"/>
  <rect x="136" y="160" width="32" height="10" rx="5" fill="#f38ba8"/>
  <rect x="196" y="156" width="176" height="18" rx="9" fill="#f38ba8" opacity="0.7"/>

  <!-- added, with the cursor -->
  <rect x="72" y="220" width="18" height="72" rx="6" fill="#cba6f7"/>
  <rect x="112" y="220" width="304" height="72" rx="18" fill="#1e3a2c"/>
  <rect x="136" y="251" width="32" height="10" rx="5" fill="#a6e3a1"/>
  <rect x="147" y="240" width="10" height="32" rx="5" fill="#a6e3a1"/>
  <rect x="196" y="247" width="200" height="18" rx="9" fill="#a6e3a1" opacity="0.7"/>

  <!-- the comment -->
  <rect x="196" y="316" width="10" height="72" rx="5" fill="#f9e2af"/>
  <rect x="228" y="322" width="168" height="18" rx="9" fill="#f9e2af"/>
  <rect x="228" y="360" width="112" height="18" rx="9" fill="#f9e2af" opacity="0.55"/>
  </g>
</svg>
